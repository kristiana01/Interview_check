<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Interview Check{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="{{ url_for('index') }}"><span class="dot"></span>Interview Check</a>
    <nav>
      <a href="{{ url_for('index') }}">Interviews</a>
      <a href="{{ url_for('summary') }}">Summary</a>
      <button id="theme" type="button" aria-label="Switch light and dark theme">Theme</button>
    </nav>
  </div>
</header>
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}" role="status">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="wrap foot">Interview Check helps to record interviews about manual software testing.</footer>
<script>
document.getElementById('theme').addEventListener('click',function(){
  var d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',d.dataset.theme)}catch(e){}});
</script>
</body>
</html>
